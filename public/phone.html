<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f5fa" />
    <title>SAM AI mobile preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 32%, #fff, #edf2f8 80%);
        color: #203047;
        font:
          13px/1.4 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .toolbar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: min(100%, 620px);
        margin: 0 auto;
        padding: 16px 20px 8px;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }

      .label strong {
        color: #183b6e;
        font-weight: 700;
      }

      .label span {
        color: #66758b;
        font-size: 12px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 6px 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #465a76;
        font: inherit;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a:hover {
        background: #e1e9f3;
        color: #183b6e;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #2777e6;
        outline-offset: 2px;
      }

      .stage {
        display: grid;
        flex: 1 1 auto;
        min-height: 0;
        padding: 10px 18px 24px;
        place-items: center;
      }

      .phone-space {
        position: relative;
        width: 414px;
        height: 898px;
      }

      .phone {
        position: absolute;
        top: 0;
        left: 0;
        width: 414px;
        height: 898px;
        padding: 24px 10px 26px;
        overflow: hidden;
        border: 2px solid #39424e;
        border-radius: 46px;
        background: #111820;
        box-shadow:
          0 22px 48px -14px #20304745,
          0 4px 10px #20304724,
          inset 0 0 0 2px #1c2633;
        transform-origin: top left;
      }

      .speaker {
        position: absolute;
        top: 10px;
        left: 50%;
        width: 50px;
        height: 5px;
        border-radius: 4px;
        background: #344052;
        transform: translateX(-50%);
      }

      .speaker::after {
        position: absolute;
        top: 0;
        left: 61px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #284266;
        content: "";
      }

      .screen {
        width: 390px;
        height: 844px;
        overflow: hidden;
        border-radius: 32px;
        background: #fff;
      }

      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        background: #fff;
      }

      .home-indicator {
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: 110px;
        height: 4px;
        border-radius: 4px;
        background: #87919e;
        transform: translateX(-50%);
      }

      @media (max-width: 430px) {
        .toolbar {
          gap: 4px;
          padding: 8px 10px 2px;
        }

        .label {
          gap: 5px;
        }

        .label span {
          font-size: 11px;
        }

        .stage {
          padding: 6px 8px 12px;
        }

        button,
        a {
          padding-inline: 7px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="label">
        <strong>SAM AI</strong><span>· Mobile preview</span>
      </div>
      <nav class="controls" aria-label="Preview controls">
        <button id="reload" type="button">Reload</button>
        <a href="./" target="_blank" rel="noopener">Open larger</a>
      </nav>
    </header>
    <main class="stage" aria-label="Phone preview">
      <div class="phone-space">
        <div class="phone">
          <div class="speaker" aria-hidden="true"></div>
          <div class="screen">
            <iframe id="preview" src="./" title="SAM AI mobile app"></iframe>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </div>
    </main>
    <script>
      const stage = document.querySelector(".stage");
      const space = document.querySelector(".phone-space");
      const phone = document.querySelector(".phone");
      const preview = document.querySelector("#preview");

      function fitPhone() {
        const style = getComputedStyle(stage);
        const availableWidth =
          stage.clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight);
        const availableHeight =
          stage.clientHeight -
          parseFloat(style.paddingTop) -
          parseFloat(style.paddingBottom);
        const scale = Math.max(
          0.01,
          Math.min(1, availableWidth / 414, availableHeight / 898),
        );
        space.style.width = `${414 * scale}px`;
        space.style.height = `${898 * scale}px`;
        phone.style.transform = `scale(${scale})`;
      }

      document.querySelector("#reload").addEventListener("click", () => {
        try {
          preview.contentWindow.location.reload();
        } catch {
          preview.src = "./";
        }
      });

      new ResizeObserver(fitPhone).observe(stage);
      window.addEventListener("resize", fitPhone);
      fitPhone();
    </script>
  </body>
</html>
